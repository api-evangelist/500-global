aid: 500-global
name: 500 Global
description: >-
  500 Global (formerly 500 Startups) is a global venture capital firm and startup accelerator founded
  in 2010 by Dave McClure and Christine Tsai and headquartered in Palo Alto / Silicon Valley, California.
  The firm invests from pre-seed to pre-IPO in globally ambitious technology founders, built on the belief
  that "talent lives everywhere, but capital and opportunity does not." 500 Global pioneered a
  "lots of little bets" seed strategy, backing hundreds of companies per fund with smaller initial checks,
  and has grown one of the industry's largest truly global seed portfolios: 3,000+ companies across 80+
  countries with $300B+ in cumulative portfolio valuation, including 35+ companies valued at $1B+ and 160+
  valued at more than $100M. It runs regional and thematic practices spanning Southeast Asia, Latin America,
  MENA, Africa, Japan, Korea, Thailand, and Eurasia, plus a Sustainable Growth strategy (health, climate,
  agriculture, gender, education), flagship accelerator programs, and the VC Unlocked investor-education
  program that has trained 1,400+ investors. As of April 30, 2025 the firm reported approximately $2.3B in
  assets under management. Notable investments include Canva, Grab, Talkdesk, Credit Karma, Twilio, and Bukalapak.
